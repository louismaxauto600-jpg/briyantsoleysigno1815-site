<!-- FILE: event-management.html -->
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Management | BSS1815 PRO-MAX-DMP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#000000,#ff6a00,#000000);
color:#ffffff;
min-height:100vh;
}

header{
background:#000;
padding:35px;
text-align:center;
border-bottom:3px solid #ff7a00;
}

header h1{
color:#ff7a00;
font-size:45px;
}

header p{
color:#ffb366;
margin-top:10px;
}

.container{
width:min(1300px,95%);
margin:30px auto;
}

.card{
background:#111;
border:2px solid #ff7a00;
border-radius:15px;
padding:20px;
margin-bottom:25px;
}

.card h2{
color:#ff7a00;
margin-bottom:15px;
}

label{
display:block;
margin-top:12px;
margin-bottom:6px;
font-weight:bold;
color:#ffb366;
}

input,
select,
textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ff7a00;
background:#000;
color:#fff;
}

textarea{
min-height:120px;
}

button{
margin-top:15px;
padding:12px 20px;
background:#ff7a00;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
color:#000;
}

button:hover{
background:#ff8c1a;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:25px;
}

.stat{
background:#000;
border:1px solid #ff7a00;
padding:20px;
border-radius:10px;
text-align:center;
}

.stat h3{
color:#ff7a00;
font-size:30px;
}

.event-list{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.event-card{
background:#000;
border:1px solid #ff7a00;
border-radius:12px;
padding:18px;
}

.event-card h3{
color:#ff7a00;
margin-bottom:10px;
}

.event-meta{
color:#ffb366;
font-size:14px;
margin-bottom:10px;
}

.search-box{
margin-bottom:20px;
}

footer{
text-align:center;
padding:20px;
margin-top:40px;
background:#000;
border-top:3px solid #ff7a00;
}

</style>

</head>

<body>

<header>

<h1>EVENT MANAGEMENT</h1>

<p>BSS1815 PRO-MAX-DMP</p>

<p>
<strong>
DEVAN DEVAN NÈT. PARE POU DEMEN.
</strong>
</p>

</header>

<div class="container">

<div class="stats">

<div class="stat">
<h3 id="totalEvents">0</h3>
<p>Total Events</p>
</div>

<div class="stat">
<h3 id="upcomingEvents">0</h3>
<p>Upcoming</p>
</div>

<div class="stat">
<h3 id="activeEvents">0</h3>
<p>Active</p>
</div>

<div class="stat">
<h3 id="completedEvents">0</h3>
<p>Completed</p>
</div>

</div>

<div class="card">

<h2>Create Event</h2>

<div class="grid">

<div>
<label>Event Title</label>
<input type="text" id="eventTitle">
</div>

<div>
<label>Category</label>
<select id="eventCategory">
<option>Meeting</option>
<option>Community Event</option>
<option>Rara Event</option>
<option>Festival</option>
<option>Conference</option>
<option>Training</option>
<option>PRO-MAX FM Event</option>
</select>
</div>

<div>
<label>Event Date</label>
<input type="date" id="eventDate">
</div>

<div>
<label>Event Time</label>
<input type="time" id="eventTime">
</div>

<div>
<label>Location</label>
<input type="text" id="eventLocation">
</div>

<div>
<label>Status</label>
<select id="eventStatus">
<option>Upcoming</option>
<option>Active</option>
<option>Completed</option>
<option>Cancelled</option>
</select>
</div>

</div>

<label>Description</label>
<textarea id="eventDescription"></textarea>

<button onclick="createEvent()">
Create Event
</button>

</div>

<div class="card">

<h2>Search Events</h2>

<div class="search-box">
<input
type="text"
id="search"
placeholder="Search Events..."
onkeyup="renderEvents()">
</div>

<div id="eventContainer" class="event-list">

</div>

</div>

</div>

<footer>

© 2026 BSS1815 PRO-MAX-DMP | Event Management

</footer>

<script>

let events=
JSON.parse(
localStorage.getItem("bss1815_events")
) || [];

function createEvent(){

const event={

title:
document.getElementById("eventTitle").value,

category:
document.getElementById("eventCategory").value,

date:
document.getElementById("eventDate").value,

time:
document.getElementById("eventTime").value,

location:
document.getElementById("eventLocation").value,

status:
document.getElementById("eventStatus").value,

description:
document.getElementById("eventDescription").value

};

if(!event.title){
alert("Event Title Required");
return;
}

events.unshift(event);

localStorage.setItem(
"bss1815_events",
JSON.stringify(events)
);

renderEvents();

}

function renderEvents(){

const container=
document.getElementById("eventContainer");

const search=
document.getElementById("search")
.value
.toLowerCase();

container.innerHTML="";

events
.filter(event=>

Object.values(event)
.join(" ")
.toLowerCase()
.includes(search)

)

.forEach(event=>{

container.innerHTML += `

<div class="event-card">

<h3>${event.title}</h3>

<div class="event-meta">
${event.category}
</div>

<p><strong>Date:</strong> ${event.date}</p>

<p><strong>Time:</strong> ${event.time}</p>

<p><strong>Location:</strong> ${event.location}</p>

<p><strong>Status:</strong> ${event.status}</p>

<p>${event.description}</p>

</div>

`;

});

updateStats();

}

function updateStats(){

document.getElementById("totalEvents")
.innerText=events.length;

document.getElementById("upcomingEvents")
.innerText=
events.filter(
x=>x.status==="Upcoming"
).length;

document.getElementById("activeEvents")
.innerText=
events.filter(
x=>x.status==="Active"
).length;

document.getElementById("completedEvents")
.innerText=
events.filter(
x=>x.status==="Completed"
).length;

}

renderEvents();

</script>

</body>
</html>

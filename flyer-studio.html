<!-- FILE: flyer-studio.html -->
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flyer Studio | BSS1815 PRO-MAX-DMP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#000000,#ff6a00,#000000);
color:#ffffff;
min-height:100vh;
}

header{
background:#000;
padding:35px;
text-align:center;
border-bottom:3px solid #ff7a00;
}

header h1{
color:#ff7a00;
font-size:45px;
}

header p{
color:#ffb366;
margin-top:10px;
}

.container{
width:min(1200px,95%);
margin:30px auto;
}

.card{
background:#111;
border:2px solid #ff7a00;
border-radius:15px;
padding:20px;
margin-bottom:25px;
}

.card h2{
color:#ff7a00;
margin-bottom:15px;
}

label{
display:block;
margin-top:12px;
margin-bottom:6px;
color:#ffb366;
font-weight:bold;
}

input,
select,
textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ff7a00;
background:#000;
color:#fff;
}

textarea{
min-height:120px;
}

button{
margin-top:15px;
padding:12px 20px;
background:#ff7a00;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
color:#000;
}

button:hover{
background:#ff8c1a;
}

.preview{
background:#000;
border:2px solid #ff7a00;
border-radius:15px;
padding:20px;
margin-top:20px;
}

.flyer-title{
font-size:32px;
color:#ff7a00;
font-weight:bold;
margin-bottom:10px;
}

.flyer-subtitle{
font-size:20px;
color:#ffb366;
margin-bottom:10px;
}

.flyer-content{
margin-top:15px;
line-height:1.7;
}

.flyer-gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
margin-top:20px;
}

.saved-flyer{
background:#000;
border:1px solid #ff7a00;
padding:15px;
border-radius:10px;
}

footer{
text-align:center;
padding:20px;
margin-top:40px;
background:#000;
border-top:3px solid #ff7a00;
}

</style>

</head>

<body>

<header>

<h1>FLYER STUDIO</h1>

<p>BSS1815 PRO-MAX-DMP</p>

<p>
<strong>
DEVAN DEVAN NÈT. PARE POU DEMEN.
</strong>
</p>

</header>

<div class="container">

<div class="card">

<h2>Create Flyer</h2>

<label>Flyer Category</label>
<select id="flyerCategory">
<option>Event Flyer</option>
<option>Official Notice</option>
<option>Community Update</option>
<option>Birthday Flyer</option>
<option>Condolence Flyer</option>
<option>Congratulations Flyer</option>
<option>PRO-MAX FM Flyer</option>
<option>Emergency Alert Flyer</option>
</select>

<label>Flyer Title</label>
<input type="text" id="flyerTitle">

<label>Subtitle</label>
<input type="text" id="flyerSubtitle">

<label>Description</label>
<textarea id="flyerDescription"></textarea>

<button onclick="generateFlyer()">
Generate Flyer
</button>

<button onclick="saveFlyer()">
Save Flyer
</button>

</div>

<div class="preview">

<h2>Flyer Preview</h2>

<div class="flyer-title" id="previewTitle">
Flyer Title
</div>

<div class="flyer-subtitle" id="previewSubtitle">
Subtitle
</div>

<div class="flyer-content" id="previewDescription">
Description will appear here...
</div>

</div>

<div class="card">

<h2>Saved Flyers</h2>

<div id="savedFlyers" class="flyer-gallery">

</div>

</div>

</div>

<footer>

© 2026 BSS1815 PRO-MAX-DMP | Flyer Studio

</footer>

<script>

let flyers=
JSON.parse(
localStorage.getItem("bss1815_flyers")
) || [];

function generateFlyer(){

document.getElementById("previewTitle").innerText=
document.getElementById("flyerTitle").value;

document.getElementById("previewSubtitle").innerText=
document.getElementById("flyerSubtitle").value;

document.getElementById("previewDescription").innerText=
document.getElementById("flyerDescription").value;

}

function saveFlyer(){

const flyer={

category:
document.getElementById("flyerCategory").value,

title:
document.getElementById("flyerTitle").value,

subtitle:
document.getElementById("flyerSubtitle").value,

description:
document.getElementById("flyerDescription").value,

date:
new Date().toLocaleString()

};

flyers.unshift(flyer);

localStorage.setItem(
"bss1815_flyers",
JSON.stringify(flyers)
);

renderFlyers();

}

function renderFlyers(){

const container=
document.getElementById("savedFlyers");

container.innerHTML="";

flyers.forEach(flyer=>{

container.innerHTML += `

<div class="saved-flyer">

<h3>${flyer.title}</h3>

<p>
<strong>Category:</strong>
${flyer.category}
</p>

<p>
${flyer.subtitle}
</p>

<p>
${flyer.description}
</p>

<p>
${flyer.date}
</p>

</div>

`;

});

}

renderFlyers();

</script>

</body>
</html>

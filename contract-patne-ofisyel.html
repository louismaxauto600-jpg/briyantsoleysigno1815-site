<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontra Patnè Ofisyèl</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(to bottom,#000,#331100,#ff6600);
    color:white;
    margin:0;
    padding:20px;
}
.container{
    max-width:1000px;
    margin:auto;
    background:rgba(0,0,0,.85);
    padding:30px;
    border-radius:15px;
    border:2px solid #ff6600;
}
h1,h2{
    color:#ff9900;
    text-align:center;
}
input,textarea,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:8px;
    border:none;
}
.signature{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}
.btn{
    background:#ff8800;
    color:black;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
.btn:hover{
    background:#ffaa33;
}
</style>

</head>

<body>

<div class="container">

<h1>KONTRA PATNÈ OFISYÈL</h1>

<p>
Kontra sa a etabli yon relasyon patenarya ofisyèl ant BSS1815 PRO-MAX DMP ak yon moun, biznis, òganizasyon oswa enstitisyon.
</p>

<h2>Enfòmasyon Patnè a</h2>

<label>Non Konplè / Non Biznis</label>
<input type="text">

<label>Responsab Prensipal</label>
<input type="text">

<label>Telefòn</label>
<input type="text">

<label>Imèl</label>
<input type="email">

<label>Adrès</label>
<input type="text">

<label>Dat Kòmansman Patenarya</label>
<input type="date">

<h2>Kalite Patenarya</h2>

<select>
<option>Sponsò Ofisyèl</option>
<option>Patnè Estratejik</option>
<option>Patnè Kominotè</option>
<option>Patnè Teknoloji</option>
<option>Patnè Medya</option>
<option>Patnè Komèsyal</option>
<option>Lòt</option>
</select>

<h2>Objektif Patenarya</h2>

<textarea rows="8"></textarea>

<h2>Obligasyon Patnè a</h2>

<textarea rows="10">
• Sipòte objektif òganizasyon an.

• Respekte imaj ak repitasyon BSS1815 PRO-MAX DMP.

• Bay sèvis oswa sipò ki dakò nan patenarya a.

• Respekte tout règleman ki etabli nan akò sa a.
</textarea>

<h2>Obligasyon BSS1815 PRO-MAX DMP</h2>

<textarea rows="10">
• Rekonèt patnè a kòm patnè ofisyèl.

• Bay vizibilite selon akò a.

• Travay avèk patnè a nan yon lespri kolaborasyon.

• Pwoteje enfòmasyon konfidansyèl yo.
</textarea>

<h2>Kondisyon Jeneral</h2>

<textarea rows="10">
• Nenpòt chanjman dwe fèt alekri.

• Nenpòt vyolasyon ka mennen nan revokasyon patenarya a.

• Tou de pati yo dakò pou aji avèk pwofesyonalis ak bon fwa.
</textarea>

<div class="signature">

<div>
<label>Siyati Reprezantan BSS1815</label>
<input type="text">
</div>

<div>
<label>Siyati Patnè Ofisyèl la</label>
<input type="text">
</div>

</div>

<center>
<button class="btn" onclick="window.print()">
PRINT KONTRA
</button>
</center>

</div>

</body>
</html>

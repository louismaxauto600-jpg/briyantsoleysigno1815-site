<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Envitasyon - BRIYANTSOLEYSIGNO1815.COM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1e293b;border-radius:16px;padding:40px 32px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo-img{max-width:180px;height:auto;margin-bottom:12px}
h1{font-size:22px;margin-bottom:8px;color:#fbbf24}
p{color:#94a3b8;font-size:14px;margin-bottom:20px;line-height:1.6}
.loader{width:48px;height:48px;border:4px solid #334155;border-top-color:#fbbf24;border-radius:50%;margin:20px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-block;background:#fbbf24;color:#0f172a;font-weight:700;padding:12px 32px;border-radius:8px;text-decoration:none;margin-top:12px;cursor:pointer;border:none;font-size:16px}
.error{background:#7f1d1d;border:1px solid #ef4444;border-radius:8px;padding:16px;margin-top:16px;font-size:14px}
.success{background:#14532d;border:1px solid #22c55e;border-radius:8px;padding:16px;margin-top:16px;font-size:14px}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<img src="./bss-my-logo.jpg" alt="BRIYANTSOLEYSIGNO1815" class="logo-img">
<h1>BRIYANTSOLEYSIGNO1815</h1>
<p id="status-msg">Ap verifye envitasyon ou...</p>
<div class="loader" id="loader"></div>
<div id="result" class="hidden"></div>
</div>

<script type="module">
import { valideEnvitasyon } from './javascript.js';

const SITE_PAGES = {
  insurance: "/insurance.html",
  realestate: "/realestate.html",
  deal: "/deal.html",
  promaxfm: "/promaxfm.html",
  ddn: "/ddn.html",
  bss1815: "/index.html"
};

async function init(){
  const loader = document.getElementById('loader');
  const msg = document.getElementById('status-msg');
  const result = document.getElementById('result');
  const code = new URLSearchParams(window.location.search).get('code');

  if(!code){
    loader.style.display='none';
    msg.textContent='Kod envitasyon manke.';
    result.classList.remove('hidden');
    result.innerHTML='<div class="error">Link sa a pa valid. Mande yon nouvo link.</div>';
    return;
  }

  try{
    const data = await valideEnvitasyon(code);
    loader.style.display='none';
    msg.textContent='Envitasyon aksepte!';
    result.classList.remove('hidden');
    const dest = SITE_PAGES[data.site] || '/index.html';
    result.innerHTML = '<div class="success">Byenveni! Ou gen akse <b>' + data.site + '</b> kom animate (6 edtan).<br><a class="btn" href="' + dest + '">Antre kounye a</a></div>';
    setTimeout(function(){ window.location.href = dest; }, 2500);
  }catch(e){
    loader.style.display='none';
    msg.textContent='Envitasyon echwe.';
    result.classList.remove('hidden');
    result.innerHTML = '<div class="error">' + e.message + '</div>';
  }
}
init();
</script>
</body>
</html>

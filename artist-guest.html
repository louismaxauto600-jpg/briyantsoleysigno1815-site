<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontra Artist Guest</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(to bottom,#000,#331100,#ff6600);
    color:white;
    margin:0;
    padding:20px;
}
.container{
    max-width:1000px;
    margin:auto;
    background:rgba(0,0,0,.85);
    padding:30px;
    border-radius:15px;
    border:2px solid #ff6600;
}
h1,h2{
    color:#ff9900;
    text-align:center;
}
input,textarea,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:8px;
    border:none;
}
.signature{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}
.btn{
    background:#ff8800;
    color:black;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
.btn:hover{
    background:#ffaa33;
}
</style>

</head>

<body>

<div class="container">

<h1>KONTRA ARTIST GUEST</h1>

<p>
Kontra sa a etabli kondisyon patisipasyon yon Atis Envite nan yon aktivite oswa evènman BSS1815 PRO-MAX DMP.
</p>

<h2>Enfòmasyon Atis la</h2>

<label>Non Konplè</label>
<input type="text">

<label>Non Atistik</label>
<input type="text">

<label>Telefòn</label>
<input type="text">

<label>WhatsApp</label>
<input type="text">

<label>Imèl</label>
<input type="email">

<label>Peyi / Vil</label>
<input type="text">

<label>Dat Evènman</label>
<input type="date">

<label>Lokal Evènman</label>
<input type="text">

<h2>Detay Pèfòmans</h2>

<label>Dire Pèfòmans (an minit)</label>
<input type="number">

<label>Kantite Mizisyen oswa Ekip</label>
<input type="number">

<label>Kalite Pèfòmans</label>
<select>
<option>Live Performance</option>
<option>Guest Appearance</option>
<option>Special Performance</option>
<option>Cultural Performance</option>
</select>

<h2>Responsablite Atis la</h2>

<textarea rows="10">
• Prezante tèt li alè pou aktivite a.

• Bay yon pèfòmans pwofesyonèl.

• Respekte règ ak direktiv òganizatè yo.

• Pwoteje imaj evènman an.

• Evite nenpòt konpòtman ki ka afekte repitasyon evènman an.
</textarea>

<h2>Responsablite BSS1815 PRO-MAX DMP</h2>

<textarea rows="10">
• Bay aksè ak espas pèfòmans lan.

• Bay enfòmasyon lojistik yo.

• Respekte kondisyon kontra a.

• Sipòte bon fonksyònman aktivite a.
</textarea>

<h2>Frè ak Peman</h2>

<label>Montan Akò a ($)</label>
<input type="number">

<label>Mòd Peman</label>
<select>
<option>Cash</option>
<option>Zelle</option>
<option>Cash App</option>
<option>Bank Transfer</option>
<option>Check</option>
</select>

<h2>Kondisyon Jeneral</h2>

<textarea rows="10">
• Nenpòt chanjman dwe fèt alekri.

• Nenpòt anilasyon dwe notifye davans.

• Tou de pati yo dakò respekte kondisyon kontra sa a.

• BSS1815 PRO-MAX DMP gen dwa itilize foto ak videyo aktivite a pou pwomosyon.
</textarea>

<div class="signature">

<div>
<label>Siyati Reprezantan BSS1815</label>
<input type="text">
</div>

<div>
<label>Siyati Artist Guest</label>
<input type="text">
</div>

</div>

<center>
<button class="btn" onclick="window.print()">
PRINT KONTRA
</button>
</center>

</div>

</body>
</html>

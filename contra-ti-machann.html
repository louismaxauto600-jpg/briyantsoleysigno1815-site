<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontra Ti Machann</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(to bottom,#000,#331100,#ff6600);
    color:white;
    margin:0;
    padding:20px;
}
.container{
    max-width:1000px;
    margin:auto;
    background:rgba(0,0,0,.85);
    padding:30px;
    border-radius:15px;
    border:2px solid #ff6600;
}
h1,h2{
    color:#ff9900;
    text-align:center;
}
input,textarea,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:8px;
    border:none;
}
.signature{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}
.btn{
    background:#ff8800;
    color:black;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
.btn:hover{
    background:#ffaa33;
}
</style>

</head>

<body>

<div class="container">

<h1>KONTRA TI MACHANN</h1>

<p>
Kontra sa a etabli relasyon ofisyèl ant BSS1815 PRO-MAX DMP ak Ti Machann ki enskri nan sistèm nan.
</p>

<h2>Enfòmasyon Ti Machann</h2>

<label>Non Konplè</label>
<input type="text">

<label>Non Biznis</label>
<input type="text">

<label>Kalite Komès</label>
<input type="text">

<label>Telefòn</label>
<input type="text">

<label>WhatsApp</label>
<input type="text">

<label>Imèl</label>
<input type="email">

<label>Adrès</label>
<input type="text">

<label>Dat Enskripsyon</label>
<input type="date">

<h2>Deskripsyon Aktivite Komèsyal</h2>

<textarea rows="6"></textarea>

<h2>Obligasyon Ti Machann</h2>

<textarea rows="10">
• Bay enfòmasyon ki kòrèk.

• Respekte règ BSS1815 PRO-MAX DMP.

• Pa itilize platfòm lan pou aktivite ilegal.

• Mete enfòmasyon yo ajou lè sa nesesè.

• Respekte kliyan ak lòt manm yo.
</textarea>

<h2>Avantaj Enskripsyon</h2>

<textarea rows="8">
• Vizibilite sou platfòm la.

• Aksè ak enfòmasyon kominotè.

• Posiblite patisipasyon nan evènman yo.

• Rekonesans kòm ti machann ofisyèl.
</textarea>

<h2>Kondisyon Jeneral</h2>

<textarea rows="10">
• BSS1815 PRO-MAX DMP ka verifye enfòmasyon yo nenpòt ki lè.

• Nenpòt enfòmasyon fo ka lakòz sispansyon oswa revokasyon.

• Tou de pati yo dakò pou respekte kondisyon kontra sa a.
</textarea>

<div class="signature">

<div>
<label>Siyati Reprezantan BSS1815</label>
<input type="text">
</div>

<div>
<label>Siyati Ti Machann</label>
<input type="text">
</div>

</div>

<center>
<button class="btn" onclick="window.print()">
PRINT KONTRA
</button>
</center>

</div>

</body>
</html>

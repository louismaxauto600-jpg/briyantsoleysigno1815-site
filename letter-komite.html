<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Committee Appointment Letter</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(to bottom,#000,#331100,#ff6600);
    color:white;
    margin:0;
    padding:20px;
}
.container{
    max-width:1000px;
    margin:auto;
    background:rgba(0,0,0,.85);
    padding:30px;
    border-radius:15px;
    border:2px solid #ff6600;
}
h1,h2{
    color:#ff9900;
    text-align:center;
}
input,textarea,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:8px;
    border:none;
}
.btn{
    background:#ff8800;
    color:black;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
.btn:hover{
    background:#ffaa33;
}
</style>
</head>

<body>

<div class="container">

<h1>COMMITTEE APPOINTMENT LETTER</h1>
<h2>BSS1815 PRO-MAX DMP</h2>

<label>Dat</label>
<input type="date">

<label>Non Moun nan</label>
<input type="text">

<label>Pozisyon nan Komite a</label>
<input type="text">

<label>Telefòn</label>
<input type="text">

<label>Imèl</label>
<input type="email">

<h2>Kalite Komite</h2>

<select>
<option>Executive Committee</option>
<option>Event Committee</option>
<option>Finance Committee</option>
<option>Technology Committee</option>
<option>Community Committee</option>
<option>Disciplinary Committee</option>
<option>Special Committee</option>
</select>

<h2>Lèt Nominasyon Komite</h2>

<textarea rows="18">
Chè Onorab,

Nou kontan enfòme ou ke BSS1815 PRO-MAX DMP chwazi ou kòm yon manm ofisyèl nan komite nou an.

Desizyon sa a fèt sou baz angajman ou, konpetans ou, ak volonte ou pou kontribye nan devlopman òganizasyon an.

Kòm manm komite a, ou pral ede nan planifikasyon, sipèvizyon, òganizasyon, ak aplikasyon objektif ak aktivite òganizasyon an.

Nou gen konfyans ke kontribisyon ou pral ede ranfòse vizyon nou epi pèmèt nou kontinye bati yon sistèm modèn, transparan, ak efikas.

Nou swete ou anpil siksè nan nouvo responsabilite sa a.

Avèk respè,

BSS1815 PRO-MAX DMP

DEVAN DEVAN NÈT.
BATI POU JODI A.
PARE POU DEMEN.
</textarea>

<label>Dat Kòmansman Fonksyon an</label>
<input type="date">

<label>Dat Fen Fonksyon an</label>
<input type="date">

<label>Non Reprezantan BSS1815</label>
<input type="text">

<label>Tit Reprezantan</label>
<input type="text">

<label>Siyati</label>
<input type="text">

<center>
<button class="btn" onclick="window.print()">
PRINT LETTER
</button>
</center>

</div>

</body>
</html>

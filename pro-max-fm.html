<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO-MAX FM</title>
<style>
  body{font-family:Arial,sans-serif;background:#000;color:#ffb36b;text-align:center;padding:40px;margin:0}
  h1{color:#ff7300;font-size:42px}
  .player{background:#0b0500;border:2px solid #ff7300;border-radius:20px;padding:35px;max-width:500px;margin:30px auto}
  .play-btn{width:90px;height:90px;border-radius:50%;background:#ff7300;color:#000;border:0;font-size:36px;cursor:pointer;margin:15px}
  .play-btn:hover{transform:scale(1.05)}
  .live{display:inline-block;background:#c00;color:#fff;padding:5px 15px;border-radius:999px;font-weight:900;font-size:13px;margin-bottom:10px}
  audio{width:100%;margin-top:15px}
  a{color:#ff7300}
  .back{margin-top:25px;display:block}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
<h1>📻 PRO-MAX FM</h1>
<div class="player">
  <span class="live">● LIVE</span>
  <h2 style="color:#ff7300">BSS1815 Radio</h2>
  <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
  <p id="status">Peze pou koute</p>
  <audio id="radioPlayer" preload="none">
    <source src="https://ice1.somafm.com/groovesalad-128-mp3" type="audio/mpeg">
  </audio>
</div>
<a class="back" href="index.html#promax">← Tounen</a>
<script src="app.js"></script>
<script>
guardPage();
const player = document.getElementById('radioPlayer');
const btn = document.getElementById('playBtn');
const status = document.getElementById('status');
function togglePlay(){
  if(player.paused){ player.play(); btn.textContent = '⏸'; status.textContent = 'Ap jwe... 🎶'; }
  else{ player.pause(); btn.textContent = '▶'; status.textContent = 'Peze pou koute'; }
}
player.onerror = function(){ status.textContent = '⚠️ Stream lan pa disponib pou kounye a'; };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontra Mizisyen</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(to bottom,#000,#331100,#ff6600);
    color:white;
    margin:0;
    padding:20px;
}
.container{
    max-width:1000px;
    margin:auto;
    background:rgba(0,0,0,.85);
    padding:30px;
    border-radius:15px;
    border:2px solid #ff6600;
}
h1,h2{
    color:#ff9900;
    text-align:center;
}
input,textarea,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:8px;
    border:none;
}
.signature{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}
.btn{
    background:#ff8800;
    color:black;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
.btn:hover{
    background:#ffaa33;
}
</style>

</head>

<body>

<div class="container">

<h1>KONTRA MIZISYEN</h1>

<p>
Kontra sa a etabli relasyon ofisyèl ant BSS1815 PRO-MAX DMP ak mizisyen ki siyen dokiman sa a.
</p>

<h2>Enfòmasyon Mizisyen</h2>

<label>Non Konplè</label>
<input type="text">

<label>Non Atistik</label>
<input type="text">

<label>Enstriman</label>
<select>
<option>Tanbou</option>
<option>Twonpèt</option>
<option>Saksofòn</option>
<option>Tibwa</option>
<option>Klavyè</option>
<option>Chantè</option>
<option>Lòt</option>
</select>

<label>Telefòn</label>
<input type="text">

<label>Imèl</label>
<input type="email">

<label>Dat Antre</label>
<input type="date">

<h2>Responsablite Mizisyen</h2>

<textarea rows="10">
• Patisipe nan repetisyon yo.

• Respekte règ òganizasyon an.

• Pwoteje imaj BSS1815 PRO-MAX DMP.

• Kenbe disiplin pandan aktivite yo.

• Evite nenpòt aksyon ki ka domaje repitasyon gwoup la.
</textarea>

<h2>Responsablite Òganizasyon an</h2>

<textarea rows="10">
• Bay enfòmasyon sou aktivite yo.

• Bay sipò administratif selon kapasite òganizasyon an.

• Trete mizisyen an avèk respè.

• Bay opòtinite patisipasyon nan aktivite ofisyèl yo.
</textarea>

<h2>Disiplin ak Revokasyon</h2>

<textarea rows="10">
• Vyolasyon règ yo ka lakòz sanksyon.

• Konsèy administrasyon an ka sispann oswa revoke kontra a.

• Nenpòt revokasyon dwe fèt selon pwosedi entèn yo.
</textarea>

<h2>Akò Final</h2>

<textarea rows="6">
Lè pati yo siyen kontra sa a, yo dakò respekte tout règ, kondisyon ak responsablite ki ekri ladan li.
</textarea>

<div class="signature">

<div>
<label>Siyati Reprezantan BSS1815</label>
<input type="text">
</div>

<div>
<label>Siyati Mizisyen</label>
<input type="text">
</div>

</div>

<center>
<button class="btn" onclick="window.print()">
PRINT KONTRA
</button>
</center>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Police Authorization Request Letter</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(to bottom,#000,#331100,#ff6600);
    color:white;
    margin:0;
    padding:20px;
}
.container{
    max-width:1000px;
    margin:auto;
    background:rgba(0,0,0,.85);
    padding:30px;
    border-radius:15px;
    border:2px solid #ff6600;
}
h1,h2{
    color:#ff9900;
    text-align:center;
}
input,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:8px;
    border:none;
}
.btn{
    background:#ff8800;
    color:black;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
.btn:hover{
    background:#ffaa33;
}
</style>
</head>

<body>

<div class="container">

<h1>POLICE AUTHORIZATION REQUEST LETTER</h1>
<h2>BSS1815 PRO-MAX DMP</h2>

<label>Date</label>
<input type="date">

<label>Police Department Name</label>
<input type="text">

<label>Police Department Address</label>
<input type="text">

<label>Event Name</label>
<input type="text">

<label>Event Date</label>
<input type="date">

<label>Event Time</label>
<input type="text">

<label>Event Location</label>
<input type="text">

<label>Expected Attendance</label>
<input type="number">

<h2>Purpose of Event</h2>
<textarea rows="5"></textarea>

<h2>Authorization Request Letter</h2>

<textarea rows="22">
Dear Sir/Madam,

On behalf of BSS1815 PRO-MAX DMP, we respectfully request police authorization and, if available, police assistance for the event listed above.

This event is being organized for community, cultural, educational, and social development purposes. We are committed to maintaining a safe, peaceful, respectful, and well-organized environment for all participants.

We respectfully request any required authorization, public safety guidance, security recommendations, traffic support, or police presence deemed appropriate by your department.

We also agree to follow all applicable rules, regulations, safety instructions, and requirements provided by the police department or local authorities.

Please let us know if additional documentation, permits, insurance, or information are required to complete this request.

Thank you for your time, cooperation, and service to the community.

Respectfully,

BSS1815 PRO-MAX DMP

DEVAN DEVAN NÈT.
BATI POU JODI A.
PARE POU DEMEN.
</textarea>

<label>Representative Name</label>
<input type="text">

<label>Title</label>
<input type="text">

<label>Phone</label>
<input type="text">

<label>Email</label>
<input type="email">

<label>Signature</label>
<input type="text">

<center>
<button class="btn" onclick="window.print()">PRINT LETTER</button>
</center>

</div>

</body>
</html>

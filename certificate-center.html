<!-- FILE: certificate-center.html -->
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Center | BSS1815 PRO-MAX-DMP</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#000000,#ff6a00,#000000);
color:#fff;
min-height:100vh;
}

header{
background:#000;
padding:35px;
text-align:center;
border-bottom:3px solid #ff7a00;
}

header h1{
color:#ff7a00;
font-size:42px;
}

.container{
width:min(1400px,95%);
margin:30px auto;
}

.card{
background:#111;
border:2px solid #ff7a00;
border-radius:15px;
padding:20px;
margin-bottom:25px;
}

.card h2{
color:#ff7a00;
margin-bottom:15px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.stat{
background:#000;
border:1px solid #ff7a00;
border-radius:12px;
padding:18px;
text-align:center;
}

.stat h3{
color:#ff7a00;
font-size:30px;
}

label{
display:block;
margin-top:10px;
margin-bottom:5px;
font-weight:bold;
color:#ffb366;
}

input,select,textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ff7a00;
background:#000;
color:#fff;
}

textarea{
min-height:120px;
}

button{
margin-top:15px;
padding:12px 20px;
background:#ff7a00;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
color:#000;
}

.certificate{
background:linear-gradient(135deg,#000000,#ff6a00,#000000);
border:5px solid #ff7a00;
border-radius:20px;
padding:40px;
margin-top:20px;
text-align:center;
}

.certificate h2{
font-size:40px;
color:#fff;
margin-bottom:20px;
}

.certificate h3{
color:#ff7a00;
font-size:28px;
margin-bottom:15px;
}

.certificate p{
font-size:18px;
line-height:1.8;
}

.certificate-id{
margin-top:20px;
font-size:14px;
color:#ffcc99;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#ff7a00;
color:#000;
padding:12px;
}

td{
border:1px solid #ff7a00;
padding:10px;
background:#000;
}

footer{
text-align:center;
padding:20px;
margin-top:40px;
background:#000;
border-top:3px solid #ff7a00;
}
</style>
</head>

<body>

<header>
<h1>CERTIFICATE CENTER</h1>
<p>BSS1815 PRO-MAX-DMP</p>
<p>DEVAN DEVAN NÈT. PARE POU DEMEN.</p>
</header>

<div class="container">

<section class="card">

<h2>Certificate Dashboard</h2>

<div class="grid">

<div class="stat">
<h3 id="totalCertificates">0</h3>
<p>Total Certificates</p>
</div>

<div class="stat">
<h3 id="volunteerCertificates">0</h3>
<p>Volunteer</p>
</div>

<div class="stat">
<h3 id="eventCertificates">0</h3>
<p>Event</p>
</div>

<div class="stat">
<h3 id="musicianCertificates">0</h3>
<p>Musician</p>
</div>

</div>

</section>

<section class="card">

<h2>Create Certificate</h2>

<div class="grid">

<div>
<label>Recipient Name</label>
<input type="text" id="recipientName">
</div>

<div>
<label>Certificate ID</label>
<input type="text" id="certificateId">
</div>

<div>
<label>Certificate Type</label>
<select id="certificateType">

<option>Volunteer Certificate</option>
<option>Appreciation Certificate</option>
<option>Musician Certificate</option>
<option>Event Certificate</option>
<option>Leadership Certificate</option>
<option>Achievement Certificate</option>

</select>
</div>

<div>
<label>Issue Date</label>
<input type="date" id="issueDate">
</div>

</div>

<label>Reason / Achievement</label>
<textarea id="achievement"></textarea>

<button onclick="generateCertificate()">
Generate Certificate
</button>

</section>

<section class="card">

<h2>Certificate Preview</h2>

<div id="certificatePreview"></div>

</section>

<section class="card">

<h2>Certificate Registry</h2>

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Type</th>
<th>Date</th>
</tr>
</thead>

<tbody id="certificateTable"></tbody>

</table>

</section>

</div>

<footer>
© 2026 BSS1815 PRO-MAX-DMP | Certificate Center
</footer>

<script>

let certificates =
JSON.parse(
localStorage.getItem("bss1815_certificates")
) || [];

function generateCertificate(){

const cert = {

name:
document.getElementById("recipientName").value,

id:
document.getElementById("certificateId").value,

type:
document.getElementById("certificateType").value,

date:
document.getElementById("issueDate").value,

achievement:
document.getElementById("achievement").value,

created:
new Date().toLocaleString()

};

if(!cert.name || !cert.id){
alert("Name and Certificate ID Required");
return;
}

certificates.unshift(cert);

localStorage.setItem(
"bss1815_certificates",
JSON.stringify(certificates)
);

document.getElementById("certificatePreview")
.innerHTML =

`
<div class="certificate">

<h2>CERTIFICATE</h2>

<h3>${cert.type}</h3>

<p>
This Certificate is Proudly Presented To
</p>

<h2 style="font-size:32px;">
${cert.name}
</h2>

<p>
For:
<br><br>
${cert.achievement}
</p>

<p>
Issue Date:
<strong>${cert.date}</strong>
</p>

<div class="certificate-id">
Certificate ID: ${cert.id}
</div>

</div>
`;

renderCertificates();

}

function renderCertificates(){

const table =
document.getElementById("certificateTable");

table.innerHTML = "";

certificates.forEach(cert=>{

table.innerHTML += `
<tr>
<td>${cert.id}</td>
<td>${cert.name}</td>
<td>${cert.type}</td>
<td>${cert.date}</td>
</tr>
`;

});

document.getElementById("totalCertificates")
.innerText = certificates.length;

document.getElementById("volunteerCertificates")
.innerText =
certificates.filter(
c=>c.type==="Volunteer Certificate"
).length;

document.getElementById("eventCertificates")
.innerText =
certificates.filter(
c=>c.type==="Event Certificate"
).length;

document.getElementById("musicianCertificates")
.innerText =
certificates.filter(
c=>c.type==="Musician Certificate"
).length;

}

renderCertificates();

</script>

</body>
</html>

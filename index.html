<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSS 1815 Broadcast</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000000, #ff8c00);
      color: #ffb347;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .box {
      background: rgba(0, 0, 0, 0.82);
      border: 2px solid #ff8c00;
      border-radius: 20px;
      padding: 35px;
      max-width: 520px;
      width: 90%;
      box-shadow: 0 0 25px rgba(255, 140, 0, 0.7);
    }

    h1 {
      margin-bottom: 10px;
      color: #ff8c00;
    }

    p {
      color: #ffd199;
      line-height: 1.5;
    }

    button {
      margin-top: 25px;
      padding: 16px 26px;
      font-size: 18px;
      font-weight: bold;
      background: #ff8c00;
      color: #000;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    button:hover {
      background: #ffae42;
    }

    .status {
      margin-top: 18px;
      color: #ffd199;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>🟠 BSS 1815</h1>
    <p>Broadcast WhatsApp System</p>
    <p>Klike bouton an pou voye mesaj ki nan Firebase Broadcast la.</p>

    <button onclick="sendBroadcast()">
      SEND WHATSAPP BROADCAST
    </button>

    <div id="status" class="status"></div>
  </div>

  <script>
    async function sendBroadcast() {
      const statusBox = document.getElementById("status");
      statusBox.innerText = "Sending broadcast...";

      try {
        const response = await fetch("/api/send-broadcast", {
          method: "POST"
        });

        const text = await response.text();

        if (response.ok) {
          statusBox.innerText = "✅ Broadcast sent: " + text;
        } else {
          statusBox.innerText = "❌ Error: " + text;
        }
      } catch (error) {
        console.error(error);
        statusBox.innerText = "❌ Network error. Check API file.";
      }
    }
  </script>
</body>
</html>

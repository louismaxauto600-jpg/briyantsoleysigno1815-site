:root{  
  --orange:#ff7900;  
  --apricot:#ffb477;  
  --black:#080301;  
  --border:#934014;  
}  
*{box-sizing:border-box}  
html{scroll-behavior:smooth}  
body{  
  margin:0;  
  font-family:Arial,Helvetica,sans-serif;  
  background:linear-gradient(135deg,#000,#321204,#000);  
  color:var(--apricot);  
  line-height:1.6;  
}  
a{color:inherit;text-decoration:none}  
button,input,textarea,select{font:inherit}  
button{cursor:pointer}  
img,video{max-width:100%}  
header{

  background:linear-gradient(90deg,#000,#351304,#000);

}  
.top{

}  
.identity{

}  
.logo{

  border-radius:50%;  
  object-fit:contain;  
  background:#000;  
}  
.brand h1{

}

}  
.nav{margin:24px auto 0}  
.btn,.nav a,.langs button,.controls button{

  color:var(--apricot);  
  font-weight:900;  
  display:inline-block;  
}  
.nav a{font-size:12px}  
.btn:hover,.nav a:hover,  
.langs button.active,.primary{

  color:#000;  
}  
section{padding:60px 18px}  
.wrap{  
  max-width:1350px;

}  
.hero{

  background:radial-gradient(ellipse,#542004,#160600,#000);  
}  
.hero-logo{  
  width:min(360px,85vw);  
  border:3px solid var(--orange);  
  border-radius:24px;  
  box-shadow:0 0 45px #ff790066;  
}  
.hero h2{  
  color:var(--orange);  
  font-size:clamp(34px,6vw,70px);  
  line-height:1.1;  
}  
.title{  
  text-align:center;  
  color:var(--orange);  
  font-size:clamp(27px,4vw,43px);  
  line-height:1.2;  
  margin:0 0 24px;  
}  
.intro{  
  text-align:center;  
  max-width:950px;  
  margin:0 auto 30px;  
}  
.grid{  
  display:grid;  
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));  
  gap:20px;  
}  
.card{  
  padding:22px;  
  border:1px solid var(--border);  
  border-radius:20px;  
  background:linear-gradient(140deg,#351304,#070200);  
  min-width:0;  
}  
.card h3{color:var(--orange)}

}  
.heroes{

}  
.portrait{

  background:#000;  
}

}

  border-radius:22px;  
  overflow:hidden;  
}  
.slide img,.slide video{  
  display:block;  
  width:100%;  
  height:clamp(280px,55vw,620px);  
  object-fit:contain;  
  background:#000;  
}  
.caption{

  font-weight:900;  
}

  overflow-wrap:anywhere;  
}  
.avatar{  
  max-width:850px;  
  margin:auto;  
  padding:25px;  
  border:2px solid var(--orange);

}  
.avatar video{  
  width:100%;  
  max-height:600px;  
  border-radius:16px;  
  border:2px solid var(--orange);  
}  
.module{text-align:center}  
.module i{  
  font-size:42px;  
  color:var(--orange);  
}  
.socials{  
  display:grid;  
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));  
  gap:14px;  
}  
.social{  
  display:flex;  
  align-items:center;  
  gap:14px;  
  border:1px solid var(--border);  
  border-radius:15px;  
  background:#120500;  
  padding:16px;  
  font-weight:bold;  
}  
.social i{  
  font-size:32px;  
  width:36px;  
  text-align:center;  
}

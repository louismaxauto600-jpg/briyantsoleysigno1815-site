<!DOCTYPE html>
<html lang="ht" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BRIYANT SOLÈY SIGNO 1815</title>
<style>
:root{--orange:#ff7900;--apricot:#ffb477;--black:#080402;--line:#d95d17;--text:#ffd0a3}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(125deg,#080402,#311006 48%,#080402);color:var(--text);line-height:1.55}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}img,video{max-width:100%}
h1,h2,h3{color:var(--orange);line-height:1.2}h2{text-align:center;font-size:clamp(24px,3.5vw,37px)}p{overflow-wrap:anywhere}
.container{width:min(1200px,94%);margin:auto}section{padding:62px 0;border-bottom:1px solid #a94820}
.subtitle{text-align:center;color:var(--apricot);font-weight:bold}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:7px;background:#160802;border:2px solid var(--orange);color:var(--text);border-radius:12px;padding:12px 17px;font-weight:800}
.btn:hover{background:var(--orange);color:#080402}.btn.primary{background:var(--orange);color:#080402}
.card{background:linear-gradient(145deg,#2a1109,#0b0503);border:2px solid #a94a22;border-radius:17px;padding:20px;min-width:0}
.grid{display:grid;gap:17px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.center{text-align:center}.small{font-size:13px}
.media-error{display:none;padding:12px;color:var(--apricot);background:#230d06;border:1px solid var(--line);border-radius:8px}
header{background:linear-gradient(100deg,#080402,#3c1409,#080402);border-bottom:3px solid var(--orange);padding:16px 0}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px}.brand{display:flex;align-items:center;gap:15px}
.brand-logo{width:105px;height:105px;border:3px solid var(--orange);border-radius:50%;object-fit:contain;background:#000}
.brand h2{font-size:clamp(18px,2.6vw,27px);margin:0 0 7px}.brand p{font-size:12px;font-weight:bold;margin:3px 0}
.langs{display:flex;gap:8px}.langs button.active{background:var(--orange);color:#080402}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:18px}nav a{font-size:13px}
.hero{min-height:620px;display:flex;align-items:center;text-align:center;background:radial-gradient(ellipse at center,#59200e,#130702 67%,#080402)}
.hero-logo{width:220px;height:220px;border:5px solid var(--orange);border-radius:50%;background:#000;object-fit:contain;box-shadow:0 0 35px #ff790055}
.hero h1{font-size:clamp(31px,5.5vw,65px)}.hero .buttons{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:25px}
.history-card{text-align:center}.history-card img{display:block;width:100%;height:250px;object-fit:contain;background:#000;border:2px solid var(--orange);border-radius:12px}
.history-card h3{font-size:19px}.history-number{font-size:22px;color:var(--orange);font-weight:900}
.slide-frame{max-width:960px;margin:25px auto;border:3px solid var(--orange);border-radius:22px;overflow:hidden;background:#000}
.slide-image,.slide-video{display:block;width:100%;height:min(65vh,570px);min-height:300px;object-fit:contain;background:#000}
.slide-caption{padding:16px;text-align:center;color:var(--orange);font-weight:900;font-size:20px;background:#1d0903;overflow-wrap:anywhere}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.counter{text-align:center;font-weight:900;margin:18px}
.gallery{display:none;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:24px}.gallery.open{display:grid}
.gallery figure{margin:0;border:2px solid #ad4d22;border-radius:12px;overflow:hidden;background:#0a0402}
.gallery img,.gallery video{width:100%;height:165px;object-fit:contain;display:block;background:#000}
.gallery figcaption{font-size:12px;text-align:center;padding:9px;color:var(--apricot);overflow-wrap:anywhere}
.community-banner{border:3px solid var(--orange);border-radius:18px;overflow:hidden;background:#000;margin-top:22px;text-align:center}
.community-banner img{display:block;width:100%;height:auto;max-height:360px;object-fit:cover;background:#000}
.community-banner h3{margin:0;padding:14px 10px 2px;font-size:22px}
.community-banner p{margin:0;padding:0 14px 16px;font-size:13px}
.avatar-box{max-width:760px;margin:20px auto;text-align:center}.avatar-box video{display:block;width:100%;max-height:520px;background:#000;border:3px solid var(--orange);border-radius:15px}
.module{text-align:center}.module .symbol{display:grid;place-items:center;width:58px;height:58px;border:3px solid var(--orange);border-radius:50%;margin:0 auto 12px;font-size:27px}
.module h3{font-size:16px;margin:8px 0}.module p{font-size:13px}
.social-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.social{text-align:center;border:2px solid var(--line);border-radius:12px;padding:13px 8px;background:#170904;font-weight:bold}.social span{display:block;font-size:23px;margin-bottom:5px}
.contact-card{text-align:center}.contact-card a{display:block;margin:8px 0;overflow-wrap:anywhere}
footer{text-align:center;padding:40px 15px;background:#090402;font-weight:bold}
#aiHelp{position:fixed;right:15px;bottom:15px;z-index:30;background:var(--orange);color:#080402;padding:14px;border-radius:14px;font-weight:900;border:2px solid #080402}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery.open{grid-template-columns:repeat(3,minmax(0,1fr))}.social-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.brand-logo{width:75px;height:75px}.topbar{justify-content:center}.brand{width:100%;justify-content:center}.grid-4,.grid-3{grid-template-columns:1fr}.gallery.open{grid-template-columns:repeat(2,minmax(0,1fr))}.social-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-logo{width:170px;height:170px}section{padding:42px 0}}
</style>
</head>

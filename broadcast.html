<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSS1815 Admin Broadcast</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  color:#ff7a00;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.panel{
  width:92%;
  max-width:760px;
  border:1px solid #ff7a00;
  border-radius:18px;
  padding:22px;
  background:#050505;
}
h1,h2{
  text-align:center;
  text-transform:uppercase;
}
input,textarea,button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border-radius:10px;
  border:1px solid #ff7a00;
  background:#000;
  color:#ff7a00;
  font-size:16px;
  box-sizing:border-box;
}
textarea{
  height:150px;
}
button{
  background:#ff7a00;
  color:#000;
  font-weight:900;
  cursor:pointer;
}
#dashboard{
  display:none;
}
.card{
  border:1px solid #ff7a00;
  border-radius:14px;
  padding:15px;
  margin-top:15px;
  background:#090909;
}
#status,#loginStatus{
  margin-top:15px;
  white-space:pre-wrap;
  text-align:center;
}
.small{
  font-size:13px;
  opacity:.85;
  text-align:center;
}
</style>
</head>

<body>

<div class="panel">

  <div id="loginArea">
    <h1>Admin Login</h1>
    <input id="email" type="email" placeholder="Admin email" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button onclick="loginAdmin()">LOGIN</button>
    <div id="loginStatus"></div>
  </div>

  <div id="dashboard">
    <h1>BSS1815 Admin Dashboard</h1>

    <div class="card">
      <h2>Admin Connected</h2>
      <p id="adminEmail" class="small"></p>
    </div>

    <div class="card">
      <h2>Broadcast Message</h2>
      <textarea id="message" placeholder="Ekri mesaj ofisyèl la..."></textarea>
      <button onclick="sendBroadcast()">SEND TO ALL</button>
      <div id="status"></div>
    </div>

    <button onclick="logoutAdmin()">LOGOUT</button>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB24Sbq_ud2qSFtdHwRhiKelokeIjCtDuY",
  authDomain: "briyant-soley-signo-1815.firebaseapp.com",
  projectId: "briyant-soley-signo-1815",
  storageBucket: "briyant-soley-signo-1815.firebasestorage.app",
  messagingSenderId: "873317957685",
  appId: "1:873317957685:web:fd8fed6192a1303099717c",
  measurementId: "G-8BX11QJQED"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("loginArea").style.display="none";
    document.getElementById("dashboard").style.display="block";
    document.getElementById("adminEmail").innerText="Logged in as: " + user.email;
  }else{
    document.getElementById("loginArea").style.display="block";
    document.getElementById("dashboard").style.display="none";
  }
});

function loginAdmin(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  document.getElementById("loginStatus").innerText="Checking...";

  auth.signInWithEmailAndPassword(email,password)
    .then(()=>{
      document.getElementById("loginStatus").innerText="Login success ✅";
    })
    .catch(err=>{
      document.getElementById("loginStatus").innerText="Access denied ❌\n" + err.message;
    });
}

function logoutAdmin(){
  auth.signOut();
}

async function sendBroadcast(){
  const user=auth.currentUser;
  const msg=document.getElementById("message").value.trim();

  if(!user){
    document.getElementById("status").innerText="Login required ❌";
    return;
  }

  if(!msg){
    document.getElementById("status").innerText="Ekri mesaj la avan.";
    return;
  }

  document.getElementById("status").innerText="Sending...";

  try{
    const token=await user.getIdToken();

    const res=await fetch("/.netlify/functions/send-broadcast",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+token
      },
      body:JSON.stringify({
        group:"all",
        message:msg
      })
    });

    const data=await res.json();

    if(!res.ok){
      document.getElementById("status").innerText="Error ❌\n" + JSON.stringify(data,null,2);
      return;
    }

    document.getElementById("status").innerText="Broadcast result:\n" + JSON.stringify(data,null,2);

  }catch(err){
    document.getElementById("status").innerText="Error ❌ " + err.message;
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSS Broadcast Panel</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#000;
  color:#ff7a00;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.panel{
  width:90%;
  max-width:500px;
  border:1px solid #ff7a00;
  padding:20px;
  border-radius:10px;
  background:#000;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

textarea{
  width:100%;
  height:150px;
  background:#000;
  color:#ff7a00;
  border:1px solid #ff7a00;
  padding:10px;
  border-radius:5px;
}

button{
  width:100%;
  margin-top:15px;
  padding:12px;
  background:#ff7a00;
  color:#000;
  font-weight:bold;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

button:hover{
  background:#000;
  color:#ff7a00;
  border:1px solid #ff7a00;
}

#status{
  margin-top:15px;
  font-size:14px;
  text-align:center;
}
</style>

</head>
<body>

<div class="panel">
  <h1>BSS Broadcast</h1>

  <textarea id="message" placeholder="Ekri mesaj ou la..."></textarea>

  <button onclick="sendBroadcast()">SEND TO ALL</button>

  <div id="status"></div>
</div>

<script>
function sendBroadcast(){
  const msg = document.getElementById("message").value;

  if(!msg){
    document.getElementById("status").innerText = "Ekri yon mesaj avan";
    return;
  }

  document.getElementById("status").innerText = "Sending...";

  fetch("/.netlify/functions/send-broadcast", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      group: "all",
      message: msg
    })
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("status").innerText = "Sent ✅";
  })
  .catch(err => {
    document.getElementById("status").innerText = "Error ❌";
  });
}
</script>

</body>
</html>

<!-- FILE: digital-registry.html -->
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Registry | BSS1815 PRO-MAX-DMP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#000000,#ff6a00,#000000);
color:#ffffff;
min-height:100vh;
}

header{
background:#000;
padding:35px;
text-align:center;
border-bottom:3px solid #ff7a00;
}

header h1{
color:#ff7a00;
font-size:45px;
}

header p{
color:#ffb366;
margin-top:10px;
}

.container{
width:min(1300px,95%);
margin:30px auto;
}

.card{
background:#111;
border:2px solid #ff7a00;
border-radius:15px;
padding:20px;
margin-bottom:25px;
}

.card h2{
color:#ff7a00;
margin-bottom:15px;
}

label{
display:block;
margin-top:12px;
margin-bottom:6px;
font-weight:bold;
color:#ffb366;
}

input,
select,
textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ff7a00;
background:#000;
color:#fff;
}

button{
margin-top:15px;
padding:12px 20px;
background:#ff7a00;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
color:#000;
}

button:hover{
background:#ff8c1a;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:25px;
}

.stat{
background:#000;
border:1px solid #ff7a00;
padding:20px;
border-radius:10px;
text-align:center;
}

.stat h3{
color:#ff7a00;
font-size:30px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table th{
background:#ff7a00;
color:#000;
padding:12px;
}

table td{
border:1px solid #ff7a00;
padding:10px;
background:#000;
}

.search-box{
margin-bottom:20px;
}

footer{
text-align:center;
padding:20px;
margin-top:40px;
background:#000;
border-top:3px solid #ff7a00;
}

</style>

</head>

<body>

<header>

<h1>DIGITAL REGISTRY</h1>

<p>BSS1815 PRO-MAX-DMP</p>

<p>
<strong>
DEVAN DEVAN NÈT. PARE POU DEMEN.
</strong>
</p>

</header>

<div class="container">

<div class="stats">

<div class="stat">
<h3 id="totalRecords">0</h3>
<p>Total Records</p>
</div>

<div class="stat">
<h3 id="totalMembers">0</h3>
<p>Members</p>
</div>

<div class="stat">
<h3 id="totalMusicians">0</h3>
<p>Musicians</p>
</div>

<div class="stat">
<h3 id="totalVendors">0</h3>
<p>Ti Machann</p>
</div>

<div class="stat">
<h3 id="totalFans">0</h3>
<p>Fanatik</p>
</div>

</div>

<div class="card">

<h2>Register New Record</h2>

<div class="grid">

<div>
<label>Full Name</label>
<input type="text" id="fullName">
</div>

<div>
<label>Category</label>
<select id="category">
<option>Member</option>
<option>Musician</option>
<option>Fanatik</option>
<option>Ti Machann</option>
<option>Leader</option>
<option>Volunteer</option>
<option>Partner</option>
</select>
</div>

<div>
<label>Phone</label>
<input type="text" id="phone">
</div>

<div>
<label>Email</label>
<input type="email" id="email">
</div>

<div>
<label>Address</label>
<input type="text" id="address">
</div>

<div>
<label>Status</label>
<select id="status">
<option>Active</option>
<option>Pending</option>
<option>Inactive</option>
</select>
</div>

</div>

<label>Notes</label>
<textarea id="notes"></textarea>

<button onclick="addRecord()">
Register Record
</button>

</div>

<div class="card">

<h2>Registry Search</h2>

<div class="search-box">
<input
type="text"
id="search"
placeholder="Search..."
onkeyup="renderRecords()">
</div>

<table>

<thead>

<tr>
<th>Name</th>
<th>Category</th>
<th>Phone</th>
<th>Email</th>
<th>Address</th>
<th>Status</th>
</tr>

</thead>

<tbody id="registryTable">

</tbody>

</table>

</div>

</div>

<footer>

© 2026 BSS1815 PRO-MAX-DMP | Digital Registry

</footer>

<script>

let registry =
JSON.parse(
localStorage.getItem("bss1815_registry")
) || [];

function addRecord(){

const record={

fullName:
document.getElementById("fullName").value,

category:
document.getElementById("category").value,

phone:
document.getElementById("phone").value,

email:
document.getElementById("email").value,

address:
document.getElementById("address").value,

status:
document.getElementById("status").value,

notes:
document.getElementById("notes").value

};

if(!record.fullName){
alert("Full Name Required");
return;
}

registry.unshift(record);

localStorage.setItem(
"bss1815_registry",
JSON.stringify(registry)
);

renderRecords();

}

function renderRecords(){

const table=
document.getElementById("registryTable");

const search=
document.getElementById("search").value.toLowerCase();

table.innerHTML="";

registry
.filter(record=>

Object.values(record)
.join(" ")
.toLowerCase()
.includes(search)

)

.forEach(record=>{

table.innerHTML += `

<tr>

<td>${record.fullName}</td>

<td>${record.category}</td>

<td>${record.phone}</td>

<td>${record.email}</td>

<td>${record.address}</td>

<td>${record.status}</td>

</tr>

`;

});

updateStats();

}

function updateStats(){

document.getElementById("totalRecords")
.innerText=registry.length;

document.getElementById("totalMembers")
.innerText=
registry.filter(
x=>x.category==="Member"
).length;

document.getElementById("totalMusicians")
.innerText=
registry.filter(
x=>x.category==="Musician"
).length;

document.getElementById("totalVendors")
.innerText=
registry.filter(
x=>x.category==="Ti Machann"
).length;

document.getElementById("totalFans")
.innerText=
registry.filter(
x=>x.category==="Fanatik"
).length;

}

renderRecords();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSS1815 Media Library</title>

<style>
body{
margin:0;
padding:20px;
background:#000;
color:#ff7a00;
font-family:Arial,sans-serif;
}

h1{
text-align:center;
font-size:38px;
margin-bottom:5px;
}

h2{
text-align:center;
color:#ffbb77;
margin-top:0;
}

.info{
text-align:center;
font-size:18px;
margin-bottom:30px;
color:#ff9933;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

.card{
background:#111;
border:1px solid #ff7a00;
border-radius:12px;
overflow:hidden;
box-shadow:0 0 10px rgba(255,166,77,.25);
}

.card img,
.card video{
width:100%;
height:260px;
object-fit:cover;
display:block;
background:#000;
}

.caption{
padding:10px;
text-align:center;
font-weight:bold;
color:#ffbb77;
border-top:1px solid #ff7a00;
word-break:break-word;
}

.back{
text-align:center;
margin-top:40px;
}

.back a{
display:inline-block;
padding:14px 24px;
background:#ff7a00;
color:#000;
font-weight:bold;
text-decoration:none;
border-radius:8px;
}
</style>
</head>

<body>

<h1>🔥 BSS1815 MEDIA LIBRARY 🔥</h1>

<h2>BSS1815 Official Media Center</h2>

<p class="info">
Foto ak videyo yo ap òganize pandan update ofisyèl yo.
</p>

<div class="grid" id="mediaGrid"></div>

<div class="back">
<a href="index.html">RETOUNEN HOME</a>
</div>

<script>

const media=[

"fanfan.jpg",
"cange1.jpg",
"Valdos.jpg",
"asmide.jpg",
"ygens.jpg",

"vice-president-ernso.jpg",
"team-sanpresyon.jpeg",
"super-fanclub-5stars.png",

"vid1.mp4",
"vid4.mp4",
"koukou.mp4",
"magazen.mp4",
"store-video.mp4"

];

const grid=document.getElementById("mediaGrid");

media.forEach(file=>{

const card=document.createElement("div");

card.className="card";

if(file.endsWith(".mp4")){

card.innerHTML=`

<video controls>
<source src="${file}" type="video/mp4">
</video>

<div class="caption">${file}</div>

`;

}else{

card.innerHTML=`

<img src="${file}" alt="${file}">

<div class="caption">${file}</div>

`;

}

grid.appendChild(card);

});

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BSS1815 Media Library</title>

<style>
body{
  background:#000;
  color:#ff7a00;
  font-family:Arial;
  margin:0;
  padding:20px;
}

h1{
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  margin-top:20px;
}

.card{
  border:1px solid #ff7a00;
  border-radius:12px;
  overflow:hidden;
}

.card img, .card video{
  width:100%;
  display:block;
}

</style>
</head>

<body>

<h1>🔥 BSS1815 MEDIA LIBRARY 🔥</h1>

<div class="grid" id="mediaGrid"></div>

<script>
const media = [
  { type:"image", src:"images/media/photo1.jpg" },
  { type:"image", src:"images/media/photo2.jpg" },
  { type:"video", src:"videos/video1.mp4" }
];

const grid = document.getElementById("mediaGrid");

media.forEach(item=>{
  const div = document.createElement("div");
  div.className="card";

  if(item.type==="image"){
    div.innerHTML = `<img src="${item.src}">`;
  }

  if(item.type==="video"){
    div.innerHTML = `<video controls src="${item.src}"></video>`;
  }

  grid.appendChild(div);
});
</script>

</body>
</html>

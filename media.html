<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BSS1815 Media Library</title>

<style>
body{
  background:#000;
  color:#ff7a00;
  font-family:Arial;
  margin:0;
  padding:20px;
}
h1{text-align:center;}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  margin-top:20px;
}
.card{
  border:1px solid #ff7a00;
  border-radius:12px;
  overflow:hidden;
}
.card img, .card video{
  width:100%;
  display:block;
}
</style>
</head>

<body>

<h1>🔥 BSS1815 MEDIA LIBRARY 🔥</h1>

<div class="grid">
  <!-- PUT YOUR REAL FILE PATHS HERE -->
  <div class="card">
    <img src="images/dirijan/maximax.jpg">
  </div>

  <div class="card">
    <img src="images/dirijan/ygens.jpg">
  </div>

  <div class="card">
    <video controls src="videos/video1.mp4"></video>
  </div>
</div>

</body>
</html>

<title>BSS1815 Media Library</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#000;
  color:#ff7a00;
  font-family:Arial,sans-serif;
}

h1{
  text-align:center;
  font-size:38px;
  margin-bottom:5px;
}

h2{
  text-align:center;
  color:#ffbb77;
  margin-top:0;
}

.info{
  text-align:center;
  font-size:18px;
  margin-bottom:30px;
  color:#ff9933;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.card{
  background:#111;
  border:1px solid #ff7a00;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 0 10px rgba(255,166,77,.25);
}

.card img,
.card video{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
  background:#000;
}

.caption{
  padding:10px;
  text-align:center;
  font-weight:bold;
  color:#ffbb77;
  border-top:1px solid #ff7a00;
  word-break:break-word;
}
</style>
</head>

media.forEach(file => {

  card.className = "card";

  if(
    file.endsWith(".mp4")
  ){

    card.innerHTML = `
      <video controls>
        <source src="${file}" type="video/mp4">
      </video>

      <div class="caption">
        ${file}
      </div>
    `;

  } else {

    card.innerHTML = `
      <img src="${file}" alt="${file}">

      <div class="caption">
        ${file}
      </div>
    `;

  }

  grid.appendChild(card);

});

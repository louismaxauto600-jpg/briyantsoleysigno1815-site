
<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSS1815 Media Library</title>

<style>
body{background:#000;color:#ff7a00;font-family:Arial;margin:0;padding:20px}
h1{text-align:center;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:25px}
.card{border:1px solid #ff7a00;border-radius:14px;overflow:hidden;background:#050505}
.card img,.card video{width:100%;height:260px;object-fit:cover;display:block;background:#111}
.caption{padding:12px;text-align:center;font-weight:900;text-transform:uppercase;border-top:1px solid #ff7a00}
</style>
</head>

<body>

<h1>🔥 BSS1815 MEDIA LIBRARY 🔥</h1>

<div class="grid">

  <div class="card">
    <img src="images/dirijan/maximax.jpg" alt="MAXIMAX">
    <div class="caption">MAXIMAX</div>
  </div>

  <div class="card">
    <img src="images/dirijan/ygens.jpg" alt="Ygens">
    <div class="caption">Ygens</div>
  </div>

  <div class="card">
    <img src="images/dirijan/kevin-blaise.jpg" alt="Kevin Blaise">
    <div class="caption">Kevin Blaise</div>
  </div>

  <div class="card">
    <img src="images/dirijan/evens-elie.jpg" alt="Evens Elie">
    <div class="caption">Evens Elie</div>
  </div>

  <div class="card">
    <video controls src="videos/video1.mp4"></video>
    <div class="caption">BSS Video 1</div>
  </div>

</div>

</body>
</html>

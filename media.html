<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSS1815 Media Library</title>

<style>
body{
  background:#000;
  color:#ff7a00;
  font-family:Arial;
  margin:0;
  padding:20px;
}
h1{text-align:center;text-transform:uppercase}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
  margin-top:25px;
}
.card{
  border:1px solid #ff7a00;
  border-radius:14px;
  overflow:hidden;
  background:#050505;
}
.card img,.card video{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
}
.caption{
  padding:10px;
  text-align:center;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>🔥 BSS1815 MEDIA LIBRARY 🔥</h1>

<div class="grid" id="mediaGrid"></div>

<script>
// 🔥 METE NON FILE OU YO ISIT
const media = [
  "photo1.jpg",
  "photo2.jpeg",
  "image3.png",
  "video1.mp4",
  "video2.mp4"
];

// 🔥 PATH OU (OU DEJA GEN SA)
const imagePath = "images/media/";
const videoPath = "videos/";

const grid = document.getElementById("mediaGrid");

media.forEach(file => {
  const card = document.createElement("div");
  card.className = "card";

  if(file.endsWith(".mp4")){
    card.innerHTML = `
      <video controls src="${videoPath + file}"></video>
      <div class="caption">${file}</div>
    `;
  } else {
    card.innerHTML = `
      <img src="${imagePath + file}">
      <div class="caption">${file}</div>
    `;
  }

  grid.appendChild(card);
});
</script>

</body>
</html>

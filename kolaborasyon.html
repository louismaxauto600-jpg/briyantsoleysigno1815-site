<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontra Kolaborasyon</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(to bottom,#000,#331100,#ff6600);
    color:white;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:rgba(0,0,0,.85);
    padding:30px;
    border-radius:15px;
    border:2px solid #ff6600;
}

h1,h2{
    color:#ff9900;
    text-align:center;
}

input,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:8px;
    border:none;
}

.signature{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.btn{
    background:#ff8800;
    color:black;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn:hover{
    background:#ffaa33;
}
</style>

</head>

<body>

<div class="container">

<h1>KONTRA KOLABORASYON</h1>

<p>
Kontra sa a etabli relasyon kolaborasyon ant BSS1815 PRO-MAX DMP ak moun oswa òganizasyon ki siyen dokiman sa a.
</p>

<h2>Enfòmasyon Kolaboratè</h2>

<label>Non Konplè</label>
<input type="text">

<label>Telefòn</label>
<input type="text">

<label>Imèl</label>
<input type="email">

<label>Adrès</label>
<input type="text">

<label>Dat</label>
<input type="date">

<h2>Obligasyon Kolaboratè</h2>

<textarea rows="8">
• Respekte règ ak politik BSS1815 PRO-MAX DMP.

• Pwoteje enfòmasyon konfidansyèl.

• Sipòte aktivite ak pwojè òganizasyon an.

• Pa itilize non oswa logo òganizasyon an san otorizasyon.

• Kenbe bon konpòtman ak pwofesyonalis.
</textarea>

<h2>Obligasyon BSS1815 PRO-MAX DMP</h2>

<textarea rows="8">
• Bay enfòmasyon ki nesesè.

• Bay sipò administratif selon bezwen.

• Trete kolaboratè a avèk respè.

• Pwoteje done ak enfòmasyon kolaboratè a.
</textarea>

<h2>Dire Kontra</h2>

<textarea rows="4">
Kontra sa a rete an vigè jiskaske youn nan pati yo mete fen ladan li alekri.
</textarea>

<div class="signature">

<div>
<label>Siyati Reprezantan BSS1815</label>
<input type="text">
</div>

<div>
<label>Siyati Kolaboratè</label>
<input type="text">
</div>

</div>

<center>
<button class="btn" onclick="window.print()">PRINT KONTRA</button>
</center>

</div>

</body>
</html>

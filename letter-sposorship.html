<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsorship Letter</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(to bottom,#000,#331100,#ff6600);
    color:white;
    margin:0;
    padding:20px;
}
.container{
    max-width:1000px;
    margin:auto;
    background:rgba(0,0,0,.85);
    padding:30px;
    border-radius:15px;
    border:2px solid #ff6600;
}
h1,h2{
    color:#ff9900;
    text-align:center;
}
input,textarea,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:8px;
    border:none;
}
.btn{
    background:#ff8800;
    color:black;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
.btn:hover{
    background:#ffaa33;
}
</style>
</head>

<body>

<div class="container">

<h1>SPONSORSHIP LETTER</h1>
<h2>BSS1815 PRO-MAX DMP</h2>

<label>Dat</label>
<input type="date">

<label>Non Sponsor / Biznis</label>
<input type="text">

<label>Responsab</label>
<input type="text">

<label>Adrès</label>
<input type="text">

<label>Telefòn</label>
<input type="text">

<label>Imèl</label>
<input type="email">

<h2>Objè Lèt la</h2>
<input type="text" value="Demann Sponsorship pou BSS1815 PRO-MAX DMP">

<h2>Lèt Sponsorship</h2>

<textarea rows="18">
Chè Sponsor,

BSS1815 PRO-MAX DMP ap kontakte ou avèk respè pou mande sipò ou kòm sponsor ofisyèl pou aktivite, pwojè, ak devlopman kominotè òganizasyon an.

BSS1815 PRO-MAX DMP se yon platfòm dijital ki fèt pou pote òganizasyon, kominikasyon, transparans, ak inovasyon nan kominote a. Objektif nou se bati yon sistèm modèn ki ede jere manm, mizisyen, evènman, dokiman, kominikasyon, ak aktivite yo pi byen.

Avèk sipò ou, nou kapab kontinye devlope pwojè sa a, ogmante vizibilite kominote a, epi bay plis sèvis ki itil pou manm yo ak piblik la.

Nou ta kontan genyen ou kòm sponsor ofisyèl epi mete non oswa biznis ou nan aktivite ak materyèl pwomosyon nou yo selon nivo sponsorship la.

Nou remèsye ou davans pou konsiderasyon ou ak sipò ou.

Avèk respè,

BSS1815 PRO-MAX DMP
DEVAN DEVAN NÈT. BATI POU JODI A. PARE POU DEMEN.
</textarea>

<h2>Nivo Sponsorship</h2>

<select>
<option>Bronze Sponsor</option>
<option>Silver Sponsor</option>
<option>Gold Sponsor</option>
<option>Platinum Sponsor</option>
<option>Official Partner Sponsor</option>
</select>

<label>Montan Sponsorship ($)</label>
<input type="number">

<label>Non Reprezantan BSS1815</label>
<input type="text">

<label>Siyati Reprezantan</label>
<input type="text">

<center>
<button class="btn" onclick="window.print()">PRINT LETTER</button>
</center>

</div>

</body>
</html>
